T_Adapter: false
data:
  batch_size: 20
  dataset: SeAct
  gpt_discription: GPT_discription/SeAct_gpt_Class_discription_new.csv
  image_tmpl: img_{:05d}.jpg
  index_bias: 1
  input_size: 224
  label_list: lists/SeAct_labels.csv
  modality: RGB
  novel_gpt_discription: GPT_discription/SeAct_gpt_Class_discription_new.csv
  novel_label_list: lists/SeAct_labels.csv
  novel_val_list: dataset_splits/SeAct/base_to_novel/SeAct_novel_val.txt
  num_segments: 8
  randaug:
    M: 0
    N: 0
  random_shift: false
  seg_length: 1
  train_list: dataset_splits/SeAct/base_to_novel/SeAct_base_train.txt
  use_llm: true
  val_list: dataset_splits/SeAct/base_to_novel/SeAct_base_val.txt
  workers: 16
logging:
  eval_freq: 1
  print_freq: 10
mm_prompt:
  CTX_INIT: a human action of
  N_CTX: 2
  PREC: fp16
  PROMPT_DEPTH: 9
  SUBSAMPLE_CLASSES: all
  use: true
network:
  Return_Attention: false
  arch: ViT-B/16
  describe: null
  drop_out: 0.1
  emb_dropout: 0.0
  init: true
  joint: false
  sim_header: Transf
  tsm: false
  type: base_to_novel
pretrain: null
prompt:
  DEEP: true
  DROPOUT: 0.1
  INITIATION: random
  use: true
resume: null
seed: 1024
solver:
  clip_gradient: 20
  epoch_offset: 0
  epochs: 150
  evaluate: false
  f_ratio: 10
  loss_type: nll
  lr: 0.0001
  lr_decay_factor: 0.1
  lr_decay_step: 15
  lr_warmup_step: 5
  momentum: 0.9
  optim: adamw
  ratio: 1
  start_epoch: 0
  type: cosine
  weight_decay: 0.2
training_name: SeAct_base_to_novel_base_to_novel
use_motion_loss: true
weight_save_dir: /root/autodl-tmp/SAMPLE
