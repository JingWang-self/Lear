# pretrain: '/root/autodl-tmp/model_best_zero_shot_ViT-16.pt'
pretrain: /root/autodl-tmp/EZ_CLIP_events/CLIP_MaPLe_SAMPLE/ViT-B/16/SeAct/SeAct_train_vit_16_8_frame/model_best.pt
# pretrain: /root/wj/EZ_CLIP_events/DVS128Gesture/clip_DVS128Gesture/ViT-B/16/DVS128Gesture/DVS128Gesture_train_vit_16_T_adaptor_8_frame/model_best.pt
seed: 1024
use_motion_loss: True
training_name:  SeAct_zero_shot_testing_vit_16_8_frame
weight_save_dir: /root/autodl-tmp/EZ_CLIP_events
T_Adapter: false
prompt:
    use: true
    # num_of_token: 100
    # num_of_text_token: 50
    INITIATION: 'random' 
    DEEP: true
    DROPOUT: 0.1
data:
    dataset: SeAct
    modality: RGB
    num_segments: 8
    seg_length: 1
    split: 1
    batch_size: 20
    workers: 8
    num_classes: 58
    image_tmpl: 'img_{:05d}.jpg'
    val_list: 'dataset_splits/SeAct/Zero-shot/val.txt'
    label_list: 'lists/seact_labels.csv'
    gpt_discription:  'GPT_discription/SeAct_gpt_Class_discription_new.csv'
    index_bias: 1
    input_size: 224
    use_llm: True
    randaug:
        N: 0 #2
        M: 0  #9
network:
    arch: ViT-B/16 #ViT-B/32 ViT-B/16  ViT-L/14
    arch_path: 
    init: True
    tsm: False
    drop_out: 0.1
    emb_dropout: 0.0 
    type: CLIP_MaPLe_SAMPLE # CLIP_Visual_Prompts, CLIP_Text_Prompts, CLIP_Multimodal_Prompts, CLIP_T_Adapter
    sim_header: "Transf"  #Transf   meanP  LSTM Conv_1D Transf_cls
    joint: False
    describe:
solver:
    type: cosine
    epochs: 150
    start_epoch: 0
    epoch_offset: 0
    optim: adamw
    lr: 1.e-5 #5.e-6
    lr_warmup_step: 5
    momentum: 0.9
    weight_decay: 0.2
    lr_decay_step: 15
    lr_decay_factor: 0.1
    clip_gradient: 20
    loss_type: nll
    evaluate: False
    ratio: 1
    f_ratio: 10
logging:
    print_freq: 10
    eval_freq: 1
COOP:
    N_CTX: 16
    CSC: False
    CTX_INIT: ""
    PREC: fp16
    CLASS_TOKEN_POSITION: "end"
COCOOP:
    N_CTX: 16
    CSC: False
    CTX_INIT: ""
    PREC: fp16
    CLASS_TOKEN_POSITION: "end"
mm_prompt:
    N_CTX: 2
    CTX_INIT: "a human action of "
    PREC: fp16
    PROMPT_DEPTH: 9
    SUBSAMPLE_CLASSES: "all"